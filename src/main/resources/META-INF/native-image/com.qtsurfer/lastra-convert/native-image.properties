# GraalVM native-image build arguments for lastra-convert.
#
# - --initialize-at-build-time on SLF4J keeps the no-op binding static-init
#   safe (no class loaders at runtime).
# - --enable-url-protocols=file is required because parquet-lite uses
#   org.apache.hadoop.fs.Path which can resolve file: URIs.
# - org.xerial.snappy.use.systemlib forces snappy-java to dlopen libsnappy.so
#   instead of extracting its bundled .so at runtime (which fails inside a
#   native-image because the resource path layout differs from a fat-jar).
# - -H:ReflectionConfigurationResources points explicitly at reflect-config.json:
#   Packer.<clinit> (org.apache.parquet.column.values.bitpacking.Packer) loads
#   LemireBitPackingBE/LE and ByteBitPackingBE/LE/ForLongBE/ForLongLE via
#   Class.forName(...).getField("factory") the first time ANY RLE/dictionary
#   column is decoded. Auto-discovery of the newer reachability-metadata.json
#   format is not reliable across GraalVM versions (confirmed: works when the
#   image is built with GraalVM/JDK 25, silently ignored when built with the
#   GraalVM/JDK 21 this project's CI pins) - explicit registration removes that
#   dependency on native-image version behavior. See issue #1.

Args = --initialize-at-build-time=org.slf4j,org.slf4j.helpers,org.slf4j.impl \
       --enable-url-protocols=file \
       -Dorg.xerial.snappy.use.systemlib=true \
       -H:ReflectionConfigurationResources=${.}/reflect-config.json
