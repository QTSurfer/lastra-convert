# GraalVM native-image build arguments for lastra-convert.
#
# - --initialize-at-build-time on SLF4J keeps the no-op binding static-init
#   safe (no class loaders at runtime).
# - --enable-url-protocols=file is required because parquet-lite uses
#   org.apache.hadoop.fs.Path which can resolve file: URIs.
# - org.xerial.snappy.use.systemlib forces snappy-java to dlopen libsnappy.so
#   instead of extracting its bundled .so at runtime (which fails inside a
#   native-image because the resource path layout differs from a fat-jar).

Args = --initialize-at-build-time=org.slf4j,org.slf4j.helpers,org.slf4j.impl \
       --enable-url-protocols=file \
       -Dorg.xerial.snappy.use.systemlib=true
